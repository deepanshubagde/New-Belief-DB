# Netlify Build and Deployment Configuration
# Monkhood Club 4D Belief Clearing Platform

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "ALLOWALL"
      X-Content-Type-Options = "nosniff"
