    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function triggerDownloadHtml() {
      const html = buildHtmlReport();
      const safeName = (state.name || 'Practitioner').replace(/[^a-zA-Z0-9_-]/g, '_');
      downloadFile(html, `Monkhood_Club_4D_Report_${safeName}.html`, 'text/html');
    }

    function triggerDownloadTxt() {
      const txt = buildMarkdownReport();
      const safeName = (state.name || 'Practitioner').replace(/[^a-zA-Z0-9_-]/g, '_');
      downloadFile(txt, `Monkhood_Club_4D_Report_${safeName}.txt`, 'text/plain');
    }

    function copyReportToClipboard() {
      const txt = buildMarkdownReport();
      if (navigator.clipboard) {
        navigator.clipboard.writeText(txt).then(() => {
          state.copiedFeedback = true;
          render();
          setTimeout(() => { state.copiedFeedback = false; render(); }, 2500);
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = txt;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        state.copiedFeedback = true;

        .replace(/"/g, '&quot;')

       ========================================================================== */

      const bar = document.getElementById('stepper-bar');

      const steps = [

        { id: 'complete', label: 'Certificate', phase: 'complete' }
      ];

      const phaseOrder = ['welcome', 'goal', 'detect_prompts', 'detect_select', 'decode', 'dissolve_logic', 'dissolve_release', 'design', 'complete'];
      const currentIndex = phaseOrder.indexOf(state.phase);

      let html = '';
      steps.forEach((s, idx) => {
        const stepTargetIndex = phaseOrder.indexOf(s.phase);
        const isActive = s.phase === state.phase || (s.phase === 'detect_prompts' && state.phase === 'detect_select') || (s.phase === 'dissolve_logic' && state.phase === 'dissolve_release');
        const isPast = stepTargetIndex <= currentIndex;

        const colorClass = isActive
          ? 'text-[#E59A46] font-bold border-b-2 border-[#E59A46]'
          : isPast
          ? 'text-gray-300 hover:text-white cursor-pointer'
          : 'text-gray-600 cursor-not-allowed';

        html += `
          <button 
            type="button"
            onclick="${isPast ? `goToPhase('${s.phase}')` : ''}"
            class="px-2.5 py-1 whitespace-nowrap transition-colors flex items-center gap-1 ${colorClass}"
          >
            <span>${s.label}</span>
          </button>
        `;
      });

      bar.innerHTML = html;
    }

                type="button" 
                onclick="window.print()" 
                class="btn-ghost py-2.5 text-xs font-medium flex items-center justify-center gap-2"
              >
                <i data-lucide="printer" class="w-4 h-4 text-gray-300"></i>
                <span>Print or Save to PDF</span>
              </button>
            </div>
          </div>

          <!-- Reset Button -->
          <div class="no-print">
            <button 
              type="button" 
              onclick="resetApp()" 
              class="btn-ghost w-full py-3 text-xs font-medium flex items-center justify-center gap-2"
            >
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
              <span>Clear Another Limiting Belief</span>
            </button>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       INITIAL BOOTSTRAP
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });

    // In case script executes after DOM is already ready
    if (document.readyState === 'interactive' || document.readyState === 'complete') {
      render();
    }
  </script>
</body>
</html>
